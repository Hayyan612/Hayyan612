name: Generate contribution snake

on:
  # Refresh once a day so the animation tracks recent activity.
  schedule:
    - cron: "0 3 * * *"
  # Allow a manual run from the Actions tab.
  workflow_dispatch:
  # Regenerate whenever the profile README changes.
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Required to push the generated SVGs to the output branch.
      contents: write

    steps:
      # svg-only is the faster variant; we do not need the gif.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Published to an "output" branch, not main, so the generated files never
      # clutter the repo history that people actually read.
      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
