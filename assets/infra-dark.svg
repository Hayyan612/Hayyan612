  <text x="190.0" y="258" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e">API · web console · identity · Postgres</text>
  <rect x="340" y="218" width="220" height="54" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
