  <text x="450.0" y="44" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8b949e">17 services across 2 Linux servers, 4 projects, no managed platform</text>
